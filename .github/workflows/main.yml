name: Build Lilium Kernel Chime NetHunter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step ini otomatis mendownload SOURCE CODE LILIUM dari repositori kamu
      - name: Checkout Source Code Kernel Lilium
        uses: actions/checkout@v4

      - name: Set Up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison zip unzip git ccache

      # Mengunduh Toolchain Lilium Clang 19 sesuai screenshot di HP kamu
      - name: Download Lilium Clang 19 Toolchain
        run: |
          git clone --depth=1 https://github.com/liliumproject/llvm-project.git -b main clang || \
          git clone --depth=1 https://gitlab.com/liliumproject/lilium-clang.git clang

      - name: Configure Kernel Options (RT5370 PnP & DT2W Default)
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          mkdir -p out
          
          # Memuat defconfig bawaan dari Source Code Lilium
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld bengal-perf_defconfig

          # Enable Driver RT5370 (Ralink) & Injection
          ./scripts/config --file out/.config \
            -e CONFIG_WIRELESS \
            -e CONFIG_NET_RADIO \
            -e CONFIG_WLAN \
            -e CONFIG_NETDEVICES \
            -e CONFIG_MAC80211 \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_RT2X00 \
            -m CONFIG_RT2800USB \
            -e CONFIG_RT2800USB_RT53XX \
            -e CONFIG_RT2800USB_RT3572 \
            -e CONFIG_RT2800USB_UNKNOWN \
            -e CONFIG_RT2X00_LIB_USB \
            -e CONFIG_RT2X00_LIB_FIRMWARE \
            -e CONFIG_RT2X00_LIB_CRYPTO

          # Enable Double Tap to Wake (DT2W) Config
          ./scripts/config --file out/.config \
            -e CONFIG_TOUCHSCREEN_DUMMY_DT2W \
            -e CONFIG_TOUCHSCREEN_XIAOMI_TOUCH \
            -e CONFIG_PANEL_DOUBLE_TAP \
            -e CONFIG_DOUBLE_TAP_TO_WAKE

          make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld olddefconfig

      - name: Compile Lilium Kernel Image
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3 (Include Firmware & Auto-DT2W Boot Script)
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            KERNEL_IMG="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image ]; then
            KERNEL_IMG="out/arch/arm64/boot/Image"
          else
            echo "Error: Image kernel Lilium tidak ditemukan!"
            exit 1
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp $KERNEL_IMG AnyKernel3/
          
          # 1. Salin Modul .ko Kernel
          mkdir -p AnyKernel3/modules/system/lib/modules
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \; 2>/dev/null || true

          # 2. Download Firmware Ralink RT5370 untuk PnP Wi-Fi
          mkdir -p AnyKernel3/modules/system/etc/firmware
          wget -q https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2800.bin -O AnyKernel3/modules/system/etc/firmware/rt2800.bin || true

          # 3. Injeksikan Skrip Auto-Enable DT2W di Ramdisk saat Booting
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=lime/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=citrus/' anykernel.sh
          
          cat << 'EOF' >> boot-patch.sh
          if [ -d /sys/touchpanel ]; then
            echo 1 > /sys/touchpanel/double_tap
          fi
          EOF
          
          zip -r9 ../Lilium-NetHunter-Chime-Kernel.zip * -x .git README.md

      - name: Upload Kernel Zip to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-NetHunter-Chime-Kernel
          path: Lilium-NetHunter-Chime-Kernel.zip
