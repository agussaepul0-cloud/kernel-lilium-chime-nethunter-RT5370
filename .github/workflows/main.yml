name: Build NetHunter Kernel - Lilium Clang RT5370

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set Up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 python-is-python3 git ccache zip unzip kmod aria2 repo wget
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      - name: Clone Lilium Kernel Source Code
        run: |
          # Menggunakan URL resmi Lilium Project tanpa pembatasan branch agar otomatis mendeteksi default branch
          git clone --depth=1 https://github.com/liliumproject/kernel_xiaomi_chime.git $GITHUB_WORKSPACE/kernel

      - name: Download Clang & AOSP GCC Toolchains
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GITHUB_WORKSPACE/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GITHUB_WORKSPACE/gcc32

      - name: Clean Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make mrproper || true
          rm -rf out

      - name: Configure Kernel Options (RT5370, Injection, DT2W)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # Hapus -Werror pada Makefile utama Lilium jika ada
          sed -i 's/-Werror//g' Makefile || true

          # Deteksi file defconfig secara fleksibel di dalam kernel Lilium
          DEFCONFIG=""
          if [ -f "arch/arm64/configs/vendor/lime-perf_defconfig" ]; then
            DEFCONFIG="vendor/lime-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/chime-perf_defconfig" ]; then
            DEFCONFIG="vendor/chime-perf_defconfig"
          elif [ -f "arch/arm64/configs/lime_defconfig" ]; then
            DEFCONFIG="lime_defconfig"
          elif [ -f "arch/arm64/configs/chime_defconfig" ]; then
            DEFCONFIG="chime_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "Menggunakan defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG

          enable_config() {
            sed -i "s/# $1 is not set/$1=y/" out/.config
            grep -q "^$1=" out/.config || echo "$1=y" >> out/.config
          }

          # 1. Framework Wireless & Packet Injection
          enable_config CONFIG_NETDEVICES
          enable_config CONFIG_WLAN
          enable_config CONFIG_CFG80211
          enable_config CONFIG_MAC80211
          enable_config CONFIG_CFG80211_INTERNAL_REGDB
          enable_config CONFIG_NL80211_TESTMODE
          enable_config CONFIG_MAC80211_MESH

          # 2. Driver Ralink RT5370 (rt2800usb)
          enable_config CONFIG_NET_RADIO
          enable_config CONFIG_WLAN_VENDOR_RALINK
          enable_config CONFIG_RT2X00
          enable_config CONFIG_RT2800USB
          enable_config CONFIG_RT2800USB_RT35XX
          enable_config CONFIG_RT2800USB_RT53XX
          enable_config CONFIG_RT2800USB_UNKNOWN
          enable_config CONFIG_RT2X00_LIB_USB
          enable_config CONFIG_RT2X00_LIB
          enable_config CONFIG_RT2X00_LIB_FIRMWARE

          # 3. Fitur Double Tap to Wake (DT2W)
          enable_config CONFIG_TOUCHSCREEN_COMMON
          enable_config CONFIG_TOUCHSCREEN_XIAOMI_TOUCH
          enable_config CONFIG_TOUCHSCREEN_DT2W

          make O=out ARCH=arm64 CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig

      - name: Compile Lilium Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb

      - name: Check Build Output
        run: |
          if [ ! -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ERROR: File Image.gz-dtb Lilium tidak ditemukan! Kompilasi gagal."
            exit 1
          fi

      - name: Package Kernel via AnyKernel3 (Inject Firmware & Auto DT2W)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          
          sed -i 's/device.name1=.*/device.name1=lime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=chime/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=citrus/' anykernel.sh

          mkdir -p ramdisk/overlay/system/etc/firmware
          wget -q https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin -O ramdisk/overlay/system/etc/firmware/rt2870.bin

          sed -i '/# boot shell script/a insert_line init.rc "on property:sys.boot_completed=1" "exec -- /system/bin/sh -c \\"echo 1 > /sys/touchpanel/double_tap\\""' anykernel.sh
          
          zip -r9 ../NetHunter-Lilium-Kernel-RT5370.zip ./* -x .git\* README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Lilium-Kernel-RT5370
          path: NetHunter-Lilium-Kernel-RT5370.zip
