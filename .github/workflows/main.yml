name: Build NetHunter Kernel - Lilium Clang RT5370 (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set Up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 git ccache zip unzip kmod aria2 repo wget

      - name: Download Exact Lilium Clang Toolchain (Commit 952d333)
        run: |
          git clone https://github.com/liliumproject/llvm-project.git $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          git fetch origin 952d33352b48dcdd45128da79b5a02a368cd024
          git checkout 952d33352b48dcdd45128da79b5a02a368cd024

      - name: Clean Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          make mrproper || true
          rm -rf out

      - name: Configure Kernel Options (RT5370, Injection, DT2W)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # Menggunakan defconfig Lilium/Chime
          if [ -f arch/arm64/configs/vendor/chime-perf_defconfig ]; then
            make O=out ARCH=arm64 vendor/chime-perf_defconfig
          elif [ -f arch/arm64/configs/vendor/lime-perf_defconfig ]; then
            make O=out ARCH=arm64 vendor/lime-perf_defconfig
          else
            make O=out ARCH=arm64 vendor/lime_defconfig
          fi

          # Helper function untuk menyuntikkan konfigurasi ke .config
          enable_config() {
            sed -i "s/# $1 is not set/$1=y/" out/.config
            grep -q "^$1=" out/.config || echo "$1=y" >> out/.config
          }

          # 1. Framework Wireless & Packet Injection (Airgeddon/NetHunter)
          enable_config CONFIG_NETDEVICES
          enable_config CONFIG_WLAN
          enable_config CONFIG_CFG80211
          enable_config CONFIG_MAC80211
          enable_config CONFIG_CFG80211_INTERNAL_REGDB
          enable_config CONFIG_NL80211_TESTMODE
          enable_config CONFIG_MAC80211_MESH

          # 2. Driver Khusus Ralink RT5370 (rt2800usb)
          enable_config CONFIG_NET_RADIO
          enable_config CONFIG_WLAN_VENDOR_RALINK
          enable_config CONFIG_RT2X00
          enable_config CONFIG_RT2800USB
          enable_config CONFIG_RT2800USB_RT35XX
          enable_config CONFIG_RT2800USB_RT53XX
          enable_config CONFIG_RT2800USB_UNKNOWN
          enable_config CONFIG_RT2X00_LIB_USB
          enable_config CONFIG_RT2
