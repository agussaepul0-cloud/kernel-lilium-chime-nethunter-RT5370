name: Build Redmi 9T Kernel (Pure Test)

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio libssl-dev git zip unzip wget

      - name: Download & Extract Lilium Clang
        run: |
          mkdir -p /tmp/clang
          cd /tmp/clang
          wget -qO clang.tar.gz "$(curl -s https://api.github.com/repos/LiliumProject/lilium-clang/releases/latest | grep "browser_download_url" | cut -d '"' -f 4 | grep "tar.gz" | head -n 1)"
          tar -xf clang.tar.gz
          echo "/tmp/clang/bin" >> $GITHUB_PATH

      - name: Compile Kernel Pure
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          mkdir -p out
          # Generate defconfig murni bawaan kernel
          make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTLD=/usr/bin/ld LLVM=1 LLVM_IAS=1 vendor/bengal-perf_defconfig
          
          # Mulai kompilasi tanpa modifikasi
          make -j$(nproc --all) \
            O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=/usr/bin/ld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error

      - name: Package with AnyKernel3
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            git clone https://github.com/Kernel-SU/AnyKernel3 --depth=1 /tmp/AnyKernel3
            rm -rf /tmp/AnyKernel3/.git
            cp out/arch/arm64/boot/Image.gz-dtb /tmp/AnyKernel3/
            cd /tmp/AnyKernel3
            zip -r9 /home/runner/Kernel_Redmi9T_Pure.zip *
          else
            echo "Kernel Image.gz-dtb tidak ditemukan!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Redmi9T_Pure
          path: /home/runner/Kernel_Redmi9T_Pure.zip
