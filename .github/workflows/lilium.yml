name: Build Pure Lilium Kernel Chime NetHunter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:18.04
      options: --privileged

    steps:
      - name: Install Essential Tools & Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            build-essential bc libncurses5-dev libssl-dev libelf-dev \
            flex bison zip unzip git ccache wget device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python python3

      - name: Clone Lilium Kernel & Dependencies Repositories
        run: |
          git clone https://github.com/liliumproject/kernel_xiaomi_chime.git kernel
          git clone https://github.com/liliumproject/kernel_qcom.git kernel/kernel_qcom

      - name: Download and Extract Official Lilium Clang Release
        run: |
          mkdir -p clang
          wget -q https://github.com/liliumproject/clang/releases/download/20250912/lilium_clang-20250912.tar.gz -O lilium_clang.tar.gz
          tar -xf lilium_clang.tar.gz -C clang/
          rm -f lilium_clang.tar.gz

      - name: Configure and Compile Pure Lilium Kernel
        shell: bash
        run: |
          cd kernel

          # Set PATH ke Clang Lilium hasil ekstrak
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          rm -rf out
          mkdir -p out

          # Load defconfig Lilium
          if [ -f arch/arm64/configs/vendor/bengal-perf_defconfig ]; then
            DEFCONFIG="vendor/bengal-perf_defconfig"
          elif [ -f arch/arm64/configs/vendor/chime_defconfig ]; then
            DEFCONFIG="vendor/chime_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          make O=out $MAKE_ARGS $DEFCONFIG

          # Matikan Werror
          ./scripts/config --file out/.config -d CONFIG_WERROR

          # Enable Driver RT5370 Wi-Fi & NetHunter Support
          ./scripts/config --file out/.config \
            -e CONFIG_WIRELESS \
            -e CONFIG_NET_RADIO \
            -e CONFIG_WLAN \
            -e CONFIG_NETDEVICES \
            -e CONFIG_MAC80211 \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_RT2X00 \
            -e CONFIG_RT2X00_LIB \
            -e CONFIG_RT2800_LIB \
            -e CONFIG_RT2X00_LIB_USB \
            -e CONFIG_RT2X00_LIB_FIRMWARE \
            -e CONFIG_RT2X00_LIB_CRYPTO \
            -e CONFIG_RT2800USB \
            -e CONFIG_RT2800USB_RT53XX \
            -e CONFIG_RT2800USB_RT3572 \
            -e CONFIG_RT2800USB_UNKNOWN

          # Enable Double Tap to Wake (DT2W)
          ./scripts/config --file out/.config \
            -e CONFIG_TOUCHSCREEN_DUMMY_DT2W \
            -e CONFIG_TOUCHSCREEN_XIAOMI_TOUCH \
            -e CONFIG_PANEL_DOUBLE_TAP \
            -e CONFIG_DOUBLE_TAP_TO_WAKE

          make O=out $MAKE_ARGS olddefconfig

          # Kompilasi murni menggunakan Clang Lilium
          make -j$(nproc --all) O=out $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) O=out $MAKE_ARGS Image.gz || make -j$(nproc --all) O=out $MAKE_ARGS Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          else
            echo "Error: File Image Kernel tidak ditemukan!"
            exit 1
          fi

          mkdir -p AnyKernel3/modules/system/lib/modules
          find kernel/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \; 2>/dev/null || true

          mkdir -p AnyKernel3/modules/system/etc/firmware
          wget -q https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2800.bin -O AnyKernel3/modules/system/etc/firmware/rt2800.bin || true

          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Pure Lilium NetHunter Chime/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=chime/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=lime/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=citrus/' anykernel.sh 2>/dev/null || true

          zip -r9 ../Pure-Lilium-NetHunter-Chime.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Lilium-NetHunter-Chime
          path: Pure-Lilium-NetHunter-Chime.zip
