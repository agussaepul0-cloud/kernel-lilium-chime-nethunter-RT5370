name: Build Lilium Kernel - Xiaomi Chime

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch Kernel Source (Kosongkan untuk default)'
        default: ''
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget curl zip unzip libncurses-dev

      - name: Clone AOSP Clang & GCC Toolchains
        run: |
          mkdir -p toolchain
          echo "Cloning AOSP Clang..."
          git clone --depth=1 https://gitlab.com/arter97/arm64-gcc.git toolchain/gcc64
          git clone --depth=1 https://gitlab.com/arter97/arm-gcc.git toolchain/gcc32
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang

      - name: Clone Kernel Source Lilium Chime
        run: |
          if [ -z "${{ inputs.branch }}" ]; then
            git clone --depth=1 https://github.com/liliumproject/kernel_xiaomi_chime.git kernel
          else
            git clone --depth=1 https://github.com/liliumproject/kernel_xiaomi_chime.git -b ${{ inputs.branch }} kernel
          fi

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          
          export CC=clang
          export CROSS_COMPILE=aarch64-elf-
          export CROSS_COMPILE_ARM32=arm-eabi-

          mkdir -p out
          make O=out chime_defconfig
          make O=out -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel image not found!"
            exit 1
          fi

          cd anykernel
          zip -r ../Lilium-Kernel-Chime-$(date +%Y%m%d).zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-Kernel-Chime-Zip
          path: Lilium-Kernel-Chime-*.zip
