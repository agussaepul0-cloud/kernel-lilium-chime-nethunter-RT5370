name: Kernel_Lilium-Nethunter-Chime-RT5370_Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git ccache zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/liliumproject/kernel_xiaomi_chime.git --depth=1 kernel
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Configure & Build Kernel
        run: |
          cd kernel

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Lilium"
          export KBUILD_BUILD_HOST="GitHubActions"

          MAKE_ARGS=(
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          # 1. Perbaikan bug limit_swap_bios di drivers/md/dm-crypt.c
          if [ -f drivers/md/dm-crypt.c ] && grep -q "limit_swap_bios" drivers/md/dm-crypt.c; then
            sed -i '/limit_swap_bios/d' drivers/md/dm-crypt.c
          fi

          # 2. Perbaikan implicit declaration module_assert_mutex di luar fungsi (file scope)
          python3 - << 'EOF'
          from pathlib import Path

          path = Path("kernel/module.c")
          if path.exists():
              content = path.read_text(encoding="utf-8", errors="ignore")
              stub = "\nstatic inline void module_assert_mutex(void) {}\n"
              content = content.replace(stub, "")

              if "module_assert_mutex(" in content and "void module_assert_mutex(" not in content:
                  lines = content.splitlines(keepends=True)
                  insert_at = 0
                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          insert_at = i + 1
                  lines.insert(insert_at, stub)
                  path.write_text("".join(lines), encoding="utf-8")
                  print(f"Inserted module_assert_mutex stub at top-level line {insert_at + 1}.")
          EOF

          # 3. Perbaikan implicit declaration switch_dev_unregister & undeclared accdet_data di wcd-mbhc-v2.c
          python3 - << 'EOF'
          from pathlib import Path
          import re

          path = Path("techpack/audio/asoc/codecs/wcd-mbhc-v2.c")
          if path.exists():
              content = path.read_text(encoding="utf-8", errors="ignore")
              original = content

              if "accdet_data" in content and not re.search(r"\b(struct\s+\w+\s+)?accdet_data\s*[;=]", content):
                  stub_var = "\nstatic int accdet_data;\n"
                  lines = content.splitlines(keepends=True)
                  insert_at = 0
                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          insert_at = i + 1
                  lines.insert(insert_at, stub_var)
                  content = "".join(lines)

              if "switch_dev_unregister" in content:
                  lines = content.splitlines(keepends=True)
                  new_lines = []
                  for line in lines:
                      if "switch_dev_unregister" in line and not line.strip().startswith("//"):
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}/* patched: {line.strip()} */\n")
                      else:
                          new_lines.append(line)
                  content = "".join(new_lines)

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print("Patched switch_dev_unregister / accdet_data in wcd-mbhc-v2.c.")
          EOF

          # 4. Perbaikan lengkap undefined symbol tracepoint msm_bus (1-to-1 per file agar bebas duplicate symbol)
          python3 - << 'EOF'
          from pathlib import Path

          bus_dir = Path("drivers/soc/qcom/msm_bus")
          all_bus_text = ""
          if bus_dir.exists():
              for p in bus_dir.rglob("*"):
                  if p.is_file() and p.suffix in {".c", ".h"}:
                      all_bus_text += p.read_text(encoding="utf-8", errors="ignore") + "\n"

          mapping = {
              bus_dir / "msm_bus_fabric_adhoc.c": ["bus_agg_bw"],
              bus_dir / "msm_bus_arb_adhoc.c": ["bus_update_request_end"],
              bus_dir / "msm_bus_bimc_adhoc.c": ["bus_bimc_config_limiter", "bus_bke_params"],
          }

          for cfile, tps in mapping.items():
              if not cfile.exists():
                  continue
              text = cfile.read_text(encoding="utf-8", errors="ignore")
              missing_tps = [
                  tp for tp in tps
                  if f"DEFINE_TRACE({tp})" not in all_bus_text
                  and f"__tracepoint_{tp}" not in all_bus_text
                  and f"DEFINE_TRACE({tp})" not in text
              ]
              if missing_tps:
                  guard = "__MSM_BUS_TP_" + "_".join(t.upper() for t in missing_tps) + "__"
                  if guard not in text:
                      block = (
                          "\n#include <linux/tracepoint.h>\n"
                          f"#ifndef {guard}\n"
                          f"#define {guard}\n"
                          + "\n".join(f"DEFINE_TRACE({tp});" for tp in missing_tps)
                          + f"\n#endif /* {guard} */\n"
                      )
                      lines = text.splitlines(keepends=True)
                      insert_at = 0
                      for idx, line in enumerate(lines):
                          if line.startswith("#include"):
                              insert_at = idx + 1
                      lines.insert(insert_at, block)
                      cfile.write_text("".join(lines), encoding="utf-8")
                      print(f"Patched {cfile} with {missing_tps}")
          EOF

          rm -rf out
          mkdir -p out

          # 5. Pilih defconfig otomatis
          if [ -f arch/arm64/configs/chime_defconfig ]; then
            DEFCONFIG="chime_defconfig"
          elif [ -f arch/arm64/configs/vendor/chime_defconfig ]; then
            DEFCONFIG="vendor/chime_defconfig"
          else
            DEFCONFIG="vendor/bengal-perf_defconfig"
          fi
          echo "Menggunakan defconfig: $DEFCONFIG"
          make O=out "${MAKE_ARGS[@]}" "$DEFCONFIG"

          # 6. Konfigurasi Wireless NetHunter RT5370, HID, & TUN
          scripts/config --file out/.config --enable CONFIG_NET
          scripts/config --file out/.config --enable CONFIG_WIRELESS
          scripts/config --file out/.config --enable CONFIG_WLAN
          scripts/config --file out/.config --enable CONFIG_NET_RADIO
          scripts/config --file out/.config --enable CONFIG_CFG80211
          scripts/config --file out/.config --enable CONFIG_MAC80211
          scripts/config --file out/.config --enable CONFIG_MAC80211_LEDS
          scripts/config --file out/.config --enable CONFIG_MAC80211_MESH
          scripts/config --file out/.config --enable CONFIG_PACKET
          scripts/config --file out/.config --enable CONFIG_NL80211_TESTMODE
          scripts/config --file out/.config --enable CONFIG_CFG80211_INTERNAL_REGDB
          scripts/config --file out/.config --disable CONFIG_CFG80211_REQUIRE_SIGNED_REGDB

          # USB OTG & Firmware Loading Support
          scripts/config --file out/.config --enable CONFIG_FW_LOADER
          scripts/config --file out/.config --enable CONFIG_USB_OTG
          scripts/config --file out/.config --enable CONFIG_USB_MON

          # HID & Tunneling Support
          scripts/config --file out/.config --enable CONFIG_TUN
          scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          scripts/config --file out/.config --enable CONFIG_USB_F_HID

          # Driver RT5370 (Ralink rt2800usb)
          scripts/config --file out/.config --enable CONFIG_USB_SUPPORT
          scripts/config --file out/.config --enable CONFIG_USB
          scripts/config --file out/.config --enable CONFIG_USB_NET_DRIVERS
          scripts/config --file out/.config --enable CONFIG_RT2X00
          scripts/config --file out/.config --enable CONFIG_RT2800USB
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT33XX
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT35XX
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT53XX
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_USB
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_FIRMWARE
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_CRYPTO

          # 7. Aktifkan DT2W Default (jika opsi tersedia di Kconfig)
          scripts/config --file out/.config --enable CONFIG_TOUCHSCREEN_DOUBLE_TAP || true

          # 8. Regenerasi Kconfig Dependensi & Verifikasi Simbol
          make O=out "${MAKE_ARGS[@]}" olddefconfig
          echo "=== Verifikasi Config NetHunter & RT5370 ==="
          grep -E "^CONFIG_(CFG80211|MAC80211|RT2X00|RT2800USB|RT2800USB_RT53XX|USB_F_HID|USB_CONFIGFS_F_HID|TUN)[=m]" out/.config || true

          # 9. Kompilasi Image & DTBS
          make -j$(nproc --all) O=out "${MAKE_ARGS[@]}" Image dtbs

      - name: Repack Installer AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          else
            echo "Error: Image file not found!" && exit 1
          fi

          # Siapkan dtb.img
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img
          elif [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/dtb.img
          elif ls kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1> /dev/null 2>&1; then
            cat kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb.img
          elif ls kernel/out/arch/arm64/boot/dts/qcom/*.dtb 1> /dev/null 2>&1; then
            cat kernel/out/arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb.img
          else
            echo "Error: DTB files not found!" && exit 1
          fi

          # Salin modul kernel (.ko) jika ada
          mkdir -p AnyKernel3/modules/system/lib/modules
          find kernel/out/ -name "*.ko" -exec cp -f {} AnyKernel3/modules/system/lib/modules/ \;
          if [ -z "$(ls -A AnyKernel3/modules/system/lib/modules/ 2>/dev/null)" ]; then
            DO_MODULES=0
          else
            DO_MODULES=1
          fi

          cd AnyKernel3

          cat << EOF > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Lilium NetHunter Chime RT5370
          do.devicecheck=0
          do.modules=$DO_MODULES
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=chime
          device.name2=lime
          device.name3=citrus
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod -R 755 tools/
          zip -r9 ../Kernel_Lilium-Nethunter-Chime-RT5370_Driver.zip * -x "README.md" "LICENSE"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Lilium-Nethunter-Chime-RT5370_Driver
          path: Kernel_Lilium-Nethunter-Chime-RT5370_Driver.zip
