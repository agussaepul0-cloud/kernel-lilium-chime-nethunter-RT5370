name: Custom Kernel Build - Redmi 9T

on:
  workflow_dispatch: # Jalankan manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swaps: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            git wget curl python3 python2 zip unzip libarchive-tools \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Toolchain (Proton Clang - Public Repo)
        run: |
          echo "Mengunduh Proton Clang publik..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Patch Makefiles to Bypass Werror
        run: |
          echo "Membersihkan -Werror dari source code kernel..."
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" \) -exec sed -i 's/-Werror//g' {} +
          echo "Pembersihan selesai!"

      - name: Setup Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Make Defconfig
        run: |
          make O=out ARCH=arm64 vendor/bengal-perf_defconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Redmi9T
          path: out/arch/arm64/boot/Image.gz-dtb
