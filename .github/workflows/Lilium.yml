name: Build Kernel Redmi 9T (Chime)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download and Extract Lilium Clang
        run: |
          mkdir -p toolchain/clang
          wget -q https://github.com/liliumproject/clang/releases/download/20250912/lilium_clang-20250912.tar.gz
          tar -xzf lilium_clang-20250912.tar.gz -C toolchain/clang
          rm lilium_clang-20250912.tar.gz

      - name: Clone Kernel Sources
        run: |
          git clone --depth=1 https://github.com/liliumproject/kernel_xiaomi_chime.git -b ursinia source
          rm -rf source/techpack/audio/asoc/codecs
          git clone --depth=1 https://github.com/liliumproject/kernel_qcom.git -b msm-4.19 source/techpack/audio/asoc/codecs

      - name: Compile Kernel
        run: |
          cd source
          export PATH="${{ github.workspace }}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Agus
          export KBUILD_BUILD_HOST=GitHub-Actions

          make O=out vendor/chime-perf_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Verify Build Output
        run: |
          if [ -f source/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "SUCCESS: File Image.gz-dtb berhasil dibuat."
          else
            echo "ERROR: File Image.gz-dtb tidak ditemukan!"
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          cp source/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 ../Kernel-Redmi9T-Chime.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9T-Chime
          path: Kernel-Redmi9T-Chime.zip
