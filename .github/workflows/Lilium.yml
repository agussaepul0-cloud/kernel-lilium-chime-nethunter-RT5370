name: Build Lilium Kernel - Xiaomi Chime

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch Kernel Source'
        default: '14'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget curl zip unzip libncurses-dev

      - name: Clone Clang Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang

      - name: Clone Kernel Source Lilium Chime
        run: |
          git clone --depth=1 https://github.com/liliumproject/kernel_xiaomi_chime.git -b ${{ inputs.branch }} kernel

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          make O=out chime_defconfig
          make O=out CC=clang -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git

          # Cek lokasi file Image hasil build
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel image not found!"
            exit 1
          fi

          cd anykernel
          zip -r ../Lilium-Kernel-Chime-$(date +%Y%m%d).zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-Kernel-Chime-Zip
          path: Lilium-Kernel-Chime-*.zip
