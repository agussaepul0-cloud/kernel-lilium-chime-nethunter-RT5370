name: Build Kernel Redmi 9T (Lime/Chime)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          bc build-essential ccache curl git libncurses5-dev libssl-dev \
          python3 zip zlib1g-dev libstdc++6 bison flex libelf-dev

      - name: Clone Source, Toolchain & AnyKernel3
        run: |
          # 1. Clone Kernel Source Code
          git clone https://github.com/stormbreaker-project/kernel_poco_citrus.git -b main kernel
          
          # 2. Clone Proton Clang
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          
          # 3. Clone GCC Cross-Compilers (Diperlukan agar aarch64-linux-android-gcc ditemukan)
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32
          
          # 4. Clone AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel

      - name: Start Kernel Compilation
        run: |
          cd kernel

          # Mendaftarkan Path Clang + GCC64 + GCC32 ke Environment PATH
          export TC_DIR=$(pwd)/../clang
          export GCC64_DIR=$(pwd)/../gcc64
          export GCC32_DIR=$(pwd)/../gcc32
          export PATH="$TC_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "--> Cleaning directory..."
          make mrproper || true
          rm -rf out

          echo "--> Generating defconfig..."
          make O=out vendor/bengal-perf_defconfig

          echo "--> Compiling kernel..."
          make -j$(nproc --all) O=out

      - name: Package AnyKernel3 for Redmi 9T
        run: |
          if [ -f "kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
              cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          elif [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
              cp kernel/out/arch/arm64/boot/Image.gz AnyKernel/
          fi

          cd AnyKernel
          
          sed -i 's/device.name1=.*/device.name1=lime/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=citrus/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=chime/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=juice/g' anykernel.sh

          zip -r9 Stormbreaker-Kernel-Lime-$(date +%Y%m%d).zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-Kernel-Redmi9T
          path: AnyKernel/Stormbreaker-Kernel-Lime-*.zip
