name: Kernel_Lilium-Nethunter-Chime-RT5370_Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git ccache zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/liliumproject/kernel_xiaomi_chime.git --depth=1 kernel
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Configure & Build Kernel
        run: |
          cd kernel

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Lilium"
          export KBUILD_BUILD_HOST="GitHubActions"

          MAKE_ARGS=(
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          # 1. Perbaikan bug limit_swap_bios di drivers/md/dm-crypt.c
          if [ -f drivers/md/dm-crypt.c ] && grep -q "limit_swap_bios" drivers/md/dm-crypt.c; then
            sed -i '/limit_swap_bios/d' drivers/md/dm-crypt.c
          fi

          # 2. Perbaikan implicit declaration module_assert_mutex di kernel/module.c
          python3 - << 'EOF'
          from pathlib import Path

          path = Path("kernel/module.c")
          if path.exists():
              content = path.read_text(encoding="utf-8", errors="ignore")
              stub = "\nstatic inline void module_assert_mutex(void) {}\n"
              content = content.replace(stub, "")

              if "module_assert_mutex(" in content and "void module_assert_mutex(" not in content:
                  lines = content.splitlines(keepends=True)
                  insert_at = 0
                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          insert_at = i + 1
                  lines.insert(insert_at, stub)
                  path.write_text("".join(lines), encoding="utf-8")
                  print(f"Inserted module_assert_mutex stub at top-level line {insert_at + 1}.")
          EOF

          # 3. Perbaikan implicit declaration switch_dev_unregister & undeclared accdet_data di wcd-mbhc-v2.c
          python3 - << 'EOF'
          from pathlib import Path
          import re

          path = Path("techpack/audio/asoc/codecs/wcd-mbhc-v2.c")
          if path.exists():
              content = path.read_text(encoding="utf-8", errors="ignore")
              original = content

              if "accdet_data" in content and not re.search(r"\b(struct\s+\w+\s+)?accdet_data\s*[;=]", content):
                  stub_var = "\nstatic int accdet_data;\n"
                  lines = content.splitlines(keepends=True)
                  insert_at = 0
                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          insert_at = i + 1
                  lines.insert(insert_at, stub_var)
                  content = "".join(lines)

              if "switch_dev_unregister" in content:
                  lines = content.splitlines(keepends=True)
                  new_lines = []
                  for line in lines:
                      if "switch_dev_unregister" in line and not line.strip().startswith("//"):
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}/* patched: {line.strip()} */\n")
                      else:
                          new_lines.append(line)
                  content = "".join(new_lines)

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print("Patched switch_dev_unregister / accdet_data in wcd-mbhc-v2.c.")
          EOF

          # 4. Perbaikan undefined symbol tracepoint msm_bus
          python3 - << 'EOF'
          from pathlib import Path

          bus_dir = Path("drivers/soc/qcom/msm_bus")
          all_bus_text = ""
          if bus_dir.exists():
              for p in bus_dir.rglob("*"):
                  if p.is_file() and p.suffix in {".c", ".h"}:
                      all_bus_text += p.read_text(encoding="utf-8", errors="ignore") + "\n"

          mapping = {
              bus_dir / "msm_bus_fabric_adhoc.c": ["bus_agg_bw"],
              bus_dir / "msm_bus_arb_adhoc.c": ["bus_update_request_end"],
              bus_dir / "msm_bus_bimc_adhoc.c": ["bus_bimc_config_limiter", "bus_bke_params"],
          }

          for cfile, tps in mapping.items():
              if not cfile.exists():
                  continue
              text = cfile.read_text(encoding="utf-8", errors="ignore")
              missing_tps = [
                  tp for tp in tps
                  if f"DEFINE_TRACE({tp})" not in all_bus_text
                  and f"__tracepoint_{tp}" not in all_bus_text
                  and f"DEFINE_TRACE({tp})" not in text
              ]
              if missing_tps:
                  guard = "__MSM_BUS_TP_" + "_".join(t.upper() for t in missing_tps) + "__"
                  if guard not in text:
                      block = (
                          "\n#include <linux/tracepoint.h>\n"
                          f"#ifndef {guard}\n"
                          f"#define {guard}\n"
                          + "\n".join(f"DEFINE_TRACE({tp});" for tp in missing_tps)
                          + f"\n#endif /* {guard} */\n"
                      )
                      lines = text.splitlines(keepends=True)
                      insert_at = 0
                      for idx, line in enumerate(lines):
                          if line.startswith("#include"):
                              insert_at = idx + 1
                      lines.insert(insert_at, block)
                      cfile.write_text("".join(lines), encoding="utf-8")
                      print(f"Patched {cfile} with {missing_tps}")
          EOF

          rm -rf out
          mkdir -p out

          # 5. Gunakan defconfig vendor/xiaomi/bengal_defconfig + gabungkan vendor/xiaomi/chime.config
          if [ -f arch/arm64/configs/vendor/xiaomi/bengal_defconfig ]; then
            DEFCONFIG="vendor/xiaomi/bengal_defconfig"
            echo "Menggunakan defconfig: $DEFCONFIG"
            make O=out "${MAKE_ARGS[@]}" "$DEFCONFIG"

            if [ -f arch/arm64/configs/vendor/xiaomi/chime.config ]; then
              echo "Menggabungkan fragment: arch/arm64/configs/vendor/xiaomi/chime.config"
              ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/chime.config
            fi
          elif [ -f arch/arm64/configs/chime_defconfig ]; then
            DEFCONFIG="chime_defconfig"
            echo "Menggunakan defconfig: $DEFCONFIG"
            make O=out "${MAKE_ARGS[@]}" "$DEFCONFIG"
          elif [ -f arch/arm64/configs/vendor/chime_defconfig ]; then
            DEFCONFIG="vendor/chime_defconfig"
            echo "Menggunakan defconfig: $DEFCONFIG"
            make O=out "${MAKE_ARGS[@]}" "$DEFCONFIG"
          else
            DEFCONFIG="vendor/bengal-perf_defconfig"
            echo "Menggunakan defconfig: $DEFCONFIG"
            make O=out "${MAKE_ARGS[@]}" "$DEFCONFIG"
          fi

          # 6. Konfigurasi Wireless NetHunter, NAT (iptables/nftables), RT5370, HID, & TUN
          AIRGEDDON_OPTS=(
            CONFIG_NET
            CONFIG_INET
            CONFIG_IP_ADVANCED_ROUTER
            CONFIG_IP_MULTIPLE_TABLES
            CONFIG_PACKET
            CONFIG_BRIDGE
            CONFIG_BRIDGE_NETFILTER
            CONFIG_WIRELESS
            CONFIG_WLAN
            CONFIG_NET_RADIO
            CONFIG_CFG80211
            CONFIG_MAC80211
            CONFIG_MAC80211_LEDS
            CONFIG_MAC80211_MESH
            CONFIG_NL80211_TESTMODE
            CONFIG_CFG80211_INTERNAL_REGDB
            CONFIG_NETFILTER
            CONFIG_NETFILTER_ADVANCED
            CONFIG_NETFILTER_NETLINK
            CONFIG_NETFILTER_NETLINK_QUEUE
            CONFIG_NETFILTER_NETLINK_LOG
            CONFIG_NF_CONNTRACK
            CONFIG_NF_CONNTRACK_MARK
            CONFIG_NF_CONNTRACK_PROCFS
            CONFIG_NF_CONNTRACK_EVENTS
            CONFIG_NF_NAT
            CONFIG_NF_NAT_IPV4
            CONFIG_NF_NAT_MASQUERADE_IPV4
            CONFIG_NF_TABLES
            CONFIG_NF_TABLES_NETDEV
            CONFIG_NF_TABLES_IPV4
            CONFIG_NFT_NAT
            CONFIG_NFT_MASQ
            CONFIG_NFT_REDIR
            CONFIG_NETFILTER_XTABLES
            CONFIG_NETFILTER_XT_NAT
            CONFIG_NETFILTER_XT_TARGET_MASQUERADE
            CONFIG_NETFILTER_XT_TARGET_REDIRECT
            CONFIG_NETFILTER_XT_TARGET_TCPMSS
            CONFIG_NETFILTER_XT_MATCH_STATE
            CONFIG_NETFILTER_XT_MATCH_CONNTRACK
            CONFIG_NETFILTER_XT_MATCH_IPVS
            CONFIG_NETFILTER_XT_MATCH_MULTIPORT
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            CONFIG_IP_NF_IPTABLES
            CONFIG_IP_NF_FILTER
            CONFIG_IP_NF_TARGET_REJECT
            CONFIG_IP_NF_NAT
            CONFIG_IP_NF_TARGET_MASQUERADE
            CONFIG_IP_NF_TARGET_REDIRECT
            CONFIG_IP_NF_MANGLE
            CONFIG_IP6_NF_IPTABLES
            CONFIG_IP6_NF_NAT
            CONFIG_IP6_NF_TARGET_MASQUERADE
            CONFIG_IP6_NF_TARGET_REDIRECT
            CONFIG_FW_LOADER
            CONFIG_USB_OTG
            CONFIG_USB_MON
            CONFIG_TUN
            CONFIG_USB_CONFIGFS_F_HID
            CONFIG_USB_F_HID
            CONFIG_USB_SUPPORT
            CONFIG_USB
            CONFIG_USB_NET_DRIVERS
            CONFIG_RT2X00
            CONFIG_RT2800USB
            CONFIG_RT2800USB_RT33XX
            CONFIG_RT2800USB_RT35XX
            CONFIG_RT2800USB_RT53XX
            CONFIG_RT2X00_LIB_USB
            CONFIG_RT2X00_LIB_FIRMWARE
            CONFIG_RT2X00_LIB_CRYPTO
            CONFIG_TOUCHSCREEN_DOUBLE_TAP
          )

          for opt in "${AIRGEDDON_OPTS[@]}"; do
            scripts/config --file out/.config --enable "$opt" || true
          done
          scripts/config --file out/.config --disable CONFIG_CFG80211_REQUIRE_SIGNED_REGDB || true

          # 7. Opsi Tambahan: TCP Congestion, Packet Schedulers, I/O Schedulers, ZRAM & Governor
          EXTRA_OPTS=(
            CONFIG_TCP_CONG_BIC
            CONFIG_TCP_CONG_CUBIC
            CONFIG_TCP_CONG_WESTWOOD
            CONFIG_TCP_CONG_HTCP
            CONFIG_TCP_CONG_BBR
            CONFIG_TCP_CONG_VENO
            CONFIG_TCP_CONG_ILLINOIS
            CONFIG_TCP_CONG_YEAH
            CONFIG_TCP_CONG_HYBLA
            CONFIG_TCP_CONG_VEGAS
            CONFIG_TCP_CONG_SCALABLE
            CONFIG_TCP_CONG_DCTCP
            CONFIG_TCP_CONG_CDG
            CONFIG_TCP_CONG_LP
            CONFIG_TCP_CONG_NV
            CONFIG_TCP_CONG_HIGHSPEED
            CONFIG_NET_SCH_FQ
            CONFIG_NET_SCH_CAKE
            CONFIG_NET_SCH_PIE
            CONFIG_NET_SCH_SFQ
            CONFIG_NET_SCH_PRIO
            CONFIG_NET_SCH_CODEL
            CONFIG_NET_SCH_HTB
            CONFIG_NET_SCH_TBF
            CONFIG_IOSCHED_DEADLINE
            CONFIG_IOSCHED_NOOP
            CONFIG_IOSCHED_CFQ
            CONFIG_CFQ_GROUP_IOSCHED
            CONFIG_MQ_IOSCHED_DEADLINE
            CONFIG_MQ_IOSCHED_KYBER
            CONFIG_MQ_IOSCHED_BFQ
            CONFIG_BLK_DEV_THROTTLING
            CONFIG_BLK_WBT
            CONFIG_BLK_WBT_SQ
            CONFIG_BLK_WBT_MQ
            CONFIG_ZRAM
            CONFIG_ZRAM_DEF_COMP_LZ4
            CONFIG_ZRAM_WRITEBACK
            CONFIG_CRYPTO_LZ4
            CONFIG_CRYPTO_LZ4HC
            CONFIG_CRYPTO_ZSTD
            CONFIG_CRYPTO_LZO
            CONFIG_CLEANCACHE
            CONFIG_FRONTSWAP
            CONFIG_CPU_FREQ_GOV_ONDEMAND
            CONFIG_CPU_FREQ_GOV_CONSERVATIVE
          )

          for opt in "${EXTRA_OPTS[@]}"; do
            scripts/config --file out/.config --enable "$opt" || true
          done

          # 8. Patch Batas Suhu Max 50°C (50000 mC) di Device Tree Thermal (DTSI)
          python3 - << 'EOF'
          from pathlib import Path
          import re

          dts_dir = Path("arch/arm64/boot/dts/vendor/qcom")
          if dts_dir.exists():
              for dtsi in sorted(dts_dir.rglob("*.dtsi")):
                  if "thermal" not in dtsi.name and "bengal" not in dtsi.name and "chime" not in dtsi.name:
                      continue
                  text = dtsi.read_text(encoding="utf-8", errors="ignore")
                  if "thermal-zones" not in text and "trips" not in text:
                      continue

                  def cap_to_50c(match):
                      prefix, val_str, suffix = match.group(1), match.group(2), match.group(3)
                      val = int(val_str)
                      if val >= 1000 and val < 50000:
                          return f"{prefix}50000{suffix}"
                      return match.group(0)

                  updated = re.sub(r"(temperature\s*=\s*<)\s*(\d+)\s*(>;)", cap_to_50c, text)
                  if updated != text:
                      dtsi.write_text(updated, encoding="utf-8")
                      print(f"Patched thermal thresholds to 50000 (50°C) in: {dtsi}")
          EOF

          # 9. Regenerasi Kconfig Dependensi & Verifikasi Simbol
          make O=out "${MAKE_ARGS[@]}" olddefconfig
          echo "=== Verifikasi Config NetHunter, NAT & RT5370 ==="
          grep -E "^CONFIG_(CFG80211|MAC80211|NF_NAT|IP_NF_NAT|NFT_NAT|NFT_MASQ|NFT_REDIR|NETFILTER_XT_TARGET_MASQUERADE|NETFILTER_XT_TARGET_REDIRECT|RT2X00|RT2800USB|RT2800USB_RT53XX|USB_F_HID|USB_CONFIGFS_F_HID|TUN)[=m]" out/.config || true

          echo "=== Verifikasi Opsi Tambahan (TCP, Qdisc, I/O, ZRAM, Governor) ==="
          grep -E "^CONFIG_(TCP_CONG_|NET_SCH_|IOSCHED_|MQ_IOSCHED_|BLK_WBT|ZRAM|CPU_FREQ_GOV_)" out/.config | sort -u || true

          # 10. Kompilasi Image & DTBS
          make -j$(nproc --all) O=out "${MAKE_ARGS[@]}" Image dtbs

      - name: Repack Installer AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          else
            echo "Error: Image file not found!" && exit 1
          fi

          # Siapkan dtb.img
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img
          elif [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/dtb.img
          elif ls kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1> /dev/null 2>&1; then
            cat kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb.img
          elif ls kernel/out/arch/arm64/boot/dts/qcom/*.dtb 1> /dev/null 2>&1; then
            cat kernel/out/arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb.img
          else
            echo "Error: DTB files not found!" && exit 1
          fi

          cd AnyKernel3

          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Lilium NetHunter Chime RT5370
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=chime
          device.name2=lime
          device.name3=citrus
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod -R 755 tools/
          zip -r9 ../Kernel_Lilium-Nethunter-Chime-RT5370_Driver.zip * -x "README.md" "LICENSE"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Lilium-Nethunter-Chime-RT5370_Driver
          path: Kernel_Lilium-Nethunter-Chime-RT5370_Driver.zip
